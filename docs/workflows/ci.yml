name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload build artifact
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: snapcode-dist
          path: dist
          retention-days: 14

  browser:
    name: Browser tests (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: snapcode:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and verify the container
        run: |
          docker run -d --name snapcode -p 8080:8080 snapcode:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz | grep -q ok; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep -q ok
          curl -fsSI http://localhost:8080/index.html | grep -qi 'content-security-policy:.*sha256-'
          curl -fsSI http://localhost:8080/.well-known/security.txt | grep -q '200'
          test "$(docker exec snapcode id -u)" != "0"
